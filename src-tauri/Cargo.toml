[package]
name = "maraton-del-conocimiento"
version = "0.1.0"
description = "Un quiz de cultura general para aprender jugando"
edition = "2021"

[lib]
name = "maraton_conocimiento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
base64 = "0.22"
